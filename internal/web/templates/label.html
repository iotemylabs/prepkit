{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Label — {{.Container.Name}}</title>
<style>
body { font-family: sans-serif; text-align: center; margin: 2rem; }
.label { display: inline-block; border: 2px solid #000; padding: 16px 24px; }
.label img { display: block; margin: 0 auto; width: 240px; height: 240px; }
.slug { font-family: monospace; font-size: 1.2rem; letter-spacing: 0.1em; }
h1 { font-size: 1.4rem; margin: 0.3em 0; }
@media print { .noprint { display: none; } }
</style>
</head>
<body>
<div class="label">
<h1>{{.Container.Name}}</h1>
<img src="/containers/{{.Container.ID}}/qr.png" alt="QR code for {{.Container.QRSlug}}">
<div class="slug">{{.Container.QRSlug}}</div>
</div>
<p class="noprint">The code contains only the opaque token above — no URL, no address, nothing
readable off this instance. Print with your browser's print function.</p>
</body>
</html>{{end}}
