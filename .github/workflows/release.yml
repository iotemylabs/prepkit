name: release

# Pushing a tag like v0.1.0 publishes binaries and a multi-arch image. A tag
# with a suffix like v0.1.0-rc.1 publishes a prerelease and leaves :latest
# alone.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/prepkit validate

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/prepkit-$GITHUB_REF_NAME-$os-$arch$ext" ./cmd/prepkit
          done
          cd dist
          sha256sum * > SHA256SUMS

      - name: Stamped binary reports its version
        run: |
          got=$("dist/prepkit-$GITHUB_REF_NAME-linux-amd64" version)
          test "$got" = "prepkit $GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $flags

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Choose tags
        id: tags
        run: |
          image=ghcr.io/iotemylabs/prepkit
          tags="$image:${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="$tags,$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
